[project]
name = "let-me-see-say"
version = "0.0.1"
description = "Local multi-agent brainstorm orchestrator (subscription-CLI native, tmux + git worktree based)"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "melt" }]
dependencies = [
    "typer>=0.12",
    "libtmux>=0.40",
]

[project.scripts]
brainstorm = "brainstormd.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brainstormd"]
